services:
  app:
    image: workflow:local
    build: .
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ORIGIN:
      WORKFLOW_LOCAL_HTTP: ${WORKFLOW_LOCAL_HTTP:-true}
    volumes:
      - workflow_data:/var/lib/workflow
    ports:
      - "3000:3000"

volumes:
  workflow_data:
    name: ${WORKFLOW_VOLUME_NAME:-workflow_data}
